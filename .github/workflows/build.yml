Build android · YML
name: Build Jochat
 
on:
  workflow_dispatch:
  push:
    branches: [ main ]
 
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
 
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
 
      - name: Use stable signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
 
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
 
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jochat.apk
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jochat-Android-APK
          path: jochat.apk
          if-no-files-found: error
          retention-days: 14
 
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jochat - dernière version
          body: Télécharge jochat.apk puis installe-le sur ton téléphone.
          files: jochat.apk
          make_latest: true
 
  pages:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
 
